name: Alpha Debian packages

'on':
  push:
    branches: ['**']
    tags: [v0.1.0-alpha1]
  pull_request:
  workflow_dispatch:
    inputs:
      run_devuan:
        description: Also run optional Devuan Excalibur installation smoke
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Select CI scope conservatively
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      arm: ${{ steps.plan.outputs.arm }}
      devuan: ${{ steps.plan.outputs.devuan }}
      candidate: ${{ steps.plan.outputs.candidate }}
      matrix: ${{ steps.plan.outputs.matrix }}
      debian: ${{ steps.plan.outputs.debian }}
      binfmt: ${{ steps.plan.outputs.binfmt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ./gpt2codex-ci.py plan --event "$GITHUB_EVENT_PATH"

  quick:
    name: Quick Rust, packaging and static checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - run: mkdir -p out .tmp/cargo-amd64
      - name: Restore trusted Cargo archives
        id: cache
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .tmp/cargo-amd64/*/*.crate
          key: g2c-trusted-crates-v1-${{ runner.os }}-amd64-${{ hashFiles('Cargo.lock', 'packaging/ci-lock.json') }}
      - name: Fast checks in pinned Debian without Qt/KF6 development packages
        env:
          IMAGE: ${{ needs.plan.outputs.debian }}
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 -e G2C_ALPHA_CONTAINER=1 -e G2C_EXPECT_ARCH=amd64 -v "$PWD:/src:ro" -v "$PWD/out:/out" -v "$PWD/.tmp/cargo-amd64:/cargo-cache" "$IMAGE" /bin/sh /src/gpt2codex-alpha-container.sh quick 2>&1 | tee out/quick.log
      - name: Save trusted Cargo archives
        if: success() && steps.cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .tmp/cargo-amd64/*/*.crate
          key: g2c-trusted-crates-v1-${{ runner.os }}-amd64-${{ hashFiles('Cargo.lock', 'packaging/ci-lock.json') }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: alpha-quick
          path: out/
          if-no-files-found: warn

  build:
    name: Debian 13 / ${{ matrix.arch }}${{ matrix.experimental && ' (experimental)' || '' }}
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - name: Initialize explicit failure report
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "out" ".tmp/cargo-$ARCH"
          python3 - <<'PY'
          import json,os,pathlib
          arch=os.environ['ARCH']
          pathlib.Path('out/result-'+arch+'.json').write_text(json.dumps({'architecture':arch,'status':'FAIL','backends':{'konsole':'not verified','qtermwidget':'not verified'},'reason':'Build/infrastructure did not complete; see build log. No package approved.'}))
          PY
      - name: Restore trusted Cargo archives
        id: cache
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .tmp/cargo-${{ matrix.arch }}/*/*.crate
          key: g2c-trusted-crates-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/ci-lock.json') }}
      - name: Register pinned ARM emulators
        if: matrix.experimental
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0
        with:
          image: ${{ needs.plan.outputs.binfmt }}
          platforms: arm,arm64
      - name: Build and test complete package inside Debian 13
        env:
          IMAGE: ${{ needs.plan.outputs.debian }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          docker run --rm --platform "$PLATFORM" -e G2C_ALPHA_CONTAINER=1 -e G2C_EXPECT_ARCH="$ARCH" -v "$PWD:/src:ro" -v "$PWD/out:/out" -v "$PWD/.tmp/cargo-$ARCH:/cargo-cache" "$IMAGE" /bin/sh /src/gpt2codex-alpha-container.sh build 2>&1 | tee out/build.log
      - name: Save trusted Cargo archives
        if: success() && steps.cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .tmp/cargo-${{ matrix.arch }}/*/*.crate
          key: g2c-trusted-crates-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/ci-lock.json') }}
      - name: Report actual architecture/backend result
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if test -f "out/result-$ARCH.json"; then cat "out/result-$ARCH.json" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain evidence, and only validated packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: alpha-build-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  compatibility:
    name: Mandatory Debian install/remove smoke
    needs: [plan, build]
    if: always() && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: alpha-build-amd64
          path: input
      - name: Install, probe and remove in a clean Debian container
        env:
          IMAGE: ${{ needs.plan.outputs.debian }}
        run: |
          set -o pipefail
          mkdir -p smoke
          test -f input/validated/gpt2codex_0.1.0~alpha1_amd64.deb
          docker run --rm --platform linux/amd64 -e G2C_ALPHA_CONTAINER=1 -v "$PWD:/src:ro" -v "$PWD/input/validated:/input:ro" -v "$PWD/smoke:/out" "$IMAGE" /bin/sh /src/gpt2codex-alpha-container.sh smoke debian 2>&1 | tee smoke/install.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: alpha-smoke-debian
          path: smoke/
          if-no-files-found: warn

  devuan:
    name: Optional Devuan Excalibur install/remove smoke
    needs: [plan, build]
    if: always() && needs.plan.outputs.devuan == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - name: Initialize honest optional failure receipt
        run: |
          mkdir -p smoke
          printf '{"status":"FAIL","reason":"Optional Devuan smoke did not complete"}\n' > smoke/smoke-devuan.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: alpha-build-amd64
          path: input
      - id: pin
        run: |
          python3 - <<'PY'
          import json,os
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('image='+json.load(open('packaging/ci-lock.json'))['images']['devuan']['image']+'\n')
          PY
      - name: Install, probe and remove in a clean Devuan container
        env:
          IMAGE: ${{ steps.pin.outputs.image }}
        run: |
          set -o pipefail
          mkdir -p smoke
          test -f input/validated/gpt2codex_0.1.0~alpha1_amd64.deb
          docker run --rm --platform linux/amd64 -e G2C_ALPHA_CONTAINER=1 -v "$PWD:/src:ro" -v "$PWD/input/validated:/input:ro" -v "$PWD/smoke:/out" "$IMAGE" /bin/sh /src/gpt2codex-alpha-container.sh smoke devuan 2>&1 | tee smoke/install.log
      - id: result
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          status='FAIL'
          try:
              report=json.load(open('smoke/smoke-devuan.json'))
              deb=pathlib.Path('input/validated/gpt2codex_0.1.0~alpha1_amd64.deb')
              if report['status']=='PASS' and report['sha256']==hashlib.sha256(deb.read_bytes()).hexdigest():
                  status='PASS'
          except (OSError,ValueError,KeyError,TypeError):
              pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('status='+status+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: alpha-smoke-devuan
          path: smoke/
          if-no-files-found: warn

  release-inputs:
    name: Validate candidate packages, Debian receipt and checksums
    needs: [plan, quick, build, compatibility, devuan]
    if: always() && needs.plan.outputs.candidate == 'true' && needs.quick.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: alpha-*
          path: artifacts
      - name: Refuse missing amd64 or mandatory Debian installation evidence
        run: |
          mkdir -p .tmp .log
          python3 ./gpt2codex-alpha.py release-index --artifacts artifacts --destination release-inputs
          cat release-inputs/ARCHITECTURES.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: alpha-release-inputs
          path: release-inputs/
          if-no-files-found: error

  summary:
    name: Alpha CI result
    needs: [plan, quick, build, compatibility, devuan, release-inputs]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Report actual scope and mandatory result
        env:
          PLAN: ${{ needs.plan.result }}
          QUICK: ${{ needs.quick.result }}
          FULL: ${{ needs.plan.outputs.full }}
          ARM: ${{ needs.plan.outputs.arm }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          BUILD: ${{ needs.build.result }}
          DEBIAN: ${{ needs.compatibility.result }}
          DEVUAN: ${{ needs.devuan.outputs.status }}
          VALIDATION: ${{ needs.release-inputs.result }}
        run: |
          python3 - <<'PY'
          import os
          e=os.environ
          lines=['Quick checks: '+e['QUICK'],'Full Debian CI: '+(e['DEBIAN'] if e['FULL']=='true' else 'NOT RUN'),'ARM64/ARMHF: '+('see individual build reports (experimental)' if e['ARM']=='true' else 'NOT RUN'),'Devuan (optional): '+(e['DEVUAN'] or 'NOT RUN'),'Release validation: '+(e['VALIDATION'] if e['CANDIDATE']=='true' else 'NOT RUN; this push is not a validated release')]
          with open(e['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n\n'.join(lines)+'\n')
          valid=e['PLAN']=='success' and e['QUICK']=='success'
          if e['FULL']=='true':
              valid=valid and (e['VALIDATION']=='success' if e['CANDIDATE']=='true' else e['BUILD']=='success' and e['DEBIAN']=='success')
          raise SystemExit(0 if valid else 1)
          PY

  publish:
    name: Separately approved alpha pre-release
    needs: [quick, release-inputs]
    if: github.ref == 'refs/tags/v0.1.0-alpha1' && vars.ALPHA_PUBLISH_ENABLED == 'true'
    environment: alpha-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: alpha-release-inputs
          path: release-inputs
      - name: Verify assets and create pre-release for the existing approved tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-inputs
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.deb SHA256SUMS ARCHITECTURES.md --verify-tag --prerelease --title 'gpt2codex 0.1.0 alpha 1' --notes-file ARCHITECTURES.md
